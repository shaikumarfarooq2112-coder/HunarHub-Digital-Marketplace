<!DOCTYPE html>
<html>
<head>
    <title>HunarHub Register</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<div class="container">

    <h1>HunarHub</h1>

    <h2>Create Account</h2>


    <input 
        type="text" 
        id="name" 
        placeholder="Enter Name"
    >


    <input 
        type="email" 
        id="email" 
        placeholder="Enter Email"
    >


    <input 
        type="password" 
        id="password" 
        placeholder="Enter Password"
    >


    <input 
        type="text" 
        id="phone" 
        placeholder="Enter Phone"
    >


    <input 
        type="text" 
        id="location" 
        placeholder="Enter Location"
    >


    <button onclick="registerUser()">
        Register
    </button>


    <p>
        Already have account?
        <a href="login.html">
            Login
        </a>
    </p>


</div>


<script src="js/register.js"></script>


</body>
</html>
