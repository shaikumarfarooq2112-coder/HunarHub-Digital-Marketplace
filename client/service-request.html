<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HunarHub | Request Service</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="navbar">

    <h2>HunarHub</h2>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="dashboard.html">Dashboard</a>

        <a href="products.html">Products</a>

        <a href="service-requests.html">
            My Requests
        </a>

        <a href="profile.html">Profile</a>

        <a href="#" onclick="logout()">Logout</a>

    </div>

</div>


<!-- ================= SERVICE REQUEST ================= -->

<div class="container">

    <h1>Request a Service</h1>

    <p>
        Connect with a local entrepreneur and request their service.
    </p>


    <div class="form-card">

        <form id="serviceRequestForm">


            <!-- Entrepreneur -->

            <label for="entrepreneurId">
                Entrepreneur
            </label>

            <select
                id="entrepreneurId"
                required>

                <option value="">
                    Select Entrepreneur
                </option>

            </select>


            <!-- Service -->

            <label for="service">
                Service
            </label>

            <input
                type="text"
                id="service"
                placeholder="Example: Pottery, Tailoring, Wood Craft"
                required>


            <!-- Description -->

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe the service you need..."
                required></textarea>


            <!-- Date -->

            <label for="date">
                Preferred Date
            </label>

            <input
                type="date"
                id="date"
                required>


            <br>


            <button type="submit">
                Send Service Request
            </button>


        </form>

    </div>

</div>


<script src="js/service-request.js"></script>


<script>

function logout(){

    localStorage.removeItem("token");

    alert("Logout successful");

    window.location.href = "login.html";

}

</script>


</body>

</html>
