<!DOCTYPE html>
<html>

<head>

<title>Add Product - HunarHub</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="container">


<h1>Add New Product</h1>


<input 
type="text"
id="name"
placeholder="Product Name">


<input 
type="text"
id="category"
placeholder="Category">


<input 
type="text"
id="description"
placeholder="Description">


<input 
type="number"
id="price"
placeholder="Price">


<input 
type="text"
id="image"
placeholder="Image Name">


<button onclick="addProduct()">
    Add Product
</button>


</div>


<script src="js/add-product.js"></script>


</body>

</html>
